<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;z-index:10;background:#1f2937;color:#fff;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
header h1{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.gear{width:40px;height:40px;border:0;border-radius:50%;background:#374151;color:#fff;font-size:22px;line-height:1;padding:0}
.gear.active{background:#2563eb}
header h1 img{width:34px;height:34px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modes{display:flex;background:#374151;border-radius:10px;overflow:hidden;flex:1;min-width:240px}
.modes button{flex:1;padding:10px 4px;border:0;background:transparent;color:#d1d5db;font-size:15px;font-weight:600}
.modes button.active{background:#2563eb;color:#fff}
input[type=date]{padding:9px;border-radius:8px;border:0;font-size:15px}
main{padding:12px;max-width:700px;margin:0 auto;padding-bottom:80px}
.cat{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.cat h2{margin:0;padding:11px 14px;background:#e5e7eb;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat h2 small{font-weight:400;color:#6b7280;font-size:13px}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid #f1f1f1;font-size:18px;user-select:none;flex-wrap:nowrap;min-height:57px}
.item .name{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.pick{cursor:pointer}
.box{width:26px;height:26px;border:2px solid #9ca3af;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex:none}
.item.need{background:#eff6ff}
.item.need .box{background:#2563eb;border-color:#2563eb}
.qtybar{display:flex;align-items:center;gap:3px;flex:none}
.qtybar>*{flex:none;display:inline-block}
.qtybar.ph{visibility:hidden;pointer-events:none}
.qtybar button{border:0;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:700}
.qtybar .sq{width:28px;height:30px;font-size:18px;padding:0}
.qtybar .n{width:22px;text-align:center;font-weight:700;font-size:17px}
.qtybar .unit{width:46px;padding:0;height:30px;font-size:14px;white-space:nowrap;background:#2563eb;color:#fff}
.wh{cursor:pointer}
.wh .qty{color:#1d4ed8;font-weight:700;font-size:16px}
.wh.done .name,.wh.done .qty{text-decoration:line-through;color:#9ca3af}
.wh.done{background:#f9fafb}
.wh .nfbtn{border:0;border-radius:8px;background:#fef3c7;color:#92400e;font-size:14px;font-weight:600;padding:0 10px;height:34px;flex:none;white-space:nowrap}
.wh.nf{background:#fffbeb}
.wh.nf .name{color:#92400e}
.wh .nftag{color:#b45309;font-weight:700;font-size:14px;flex:none}
.nfsec h2{background:#fef3c7}
.nfclr{border:0;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:600;font-size:15px;padding:0 14px;height:36px;flex:none}
.del{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1}
.form{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.form h3{margin:0 0 10px;font-size:17px}
.form label{display:block;margin:8px 0 4px;font-size:14px;color:#4b5563}
.form input[type=text],.form select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;background:#fff}
.form .chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:15px}
.form .chk input{width:20px;height:20px}
.btn{padding:11px 16px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-size:16px;font-weight:600;margin-top:10px;width:100%}
.btn.blue{background:#2563eb}
.tools{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.tools button{padding:10px 14px;border:0;border-radius:8px;background:#e5e7eb;font-size:15px}
.empty{padding:18px 14px;color:#6b7280;text-align:center}
.sum{margin:0 0 12px;color:#4b5563;font-size:15px}
.mini{width:30px;height:30px;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.ov[hidden]{display:none}
.dlg{background:#fff;border-radius:14px;padding:18px;width:min(320px,90vw)}
.dlg h3{margin:0 0 12px;font-size:18px}
.dlg input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:20px;text-align:center;letter-spacing:6px}
.dlg .err{color:#b91c1c;font-size:14px;min-height:20px;margin-top:6px}
.dlg .btns{display:flex;gap:8px}
.dlg .btn{margin-top:6px}
.btn.gray{background:#6b7280}
.edit{border:0;background:#dbeafe;color:#1d4ed8;border-radius:8px;width:36px;height:36px;font-size:17px;line-height:1}
.edit.mini{width:30px;height:30px;font-size:15px}
.acts{display:flex;gap:6px}
.mv{border:0;background:#e5e7eb;color:#374151;border-radius:8px;width:32px;height:36px;font-size:14px;line-height:1;padding:0}
.mv.mini{width:28px;height:30px;font-size:12px}
.mv:disabled{opacity:.3}
.dlg label{display:block;margin:8px 0 4px;font-size:14px;color:#4b5563}
.dlg select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;background:#fff}
#edName{text-align:right;letter-spacing:normal;font-size:17px}
.net{background:#f59e0b;color:#111827;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.net[hidden],.toast[hidden]{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
</style>

<div class="btns"><button class="btn" id="pwOk">אישור</button><button class="btn gray" id="pwCancel">ביטול</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch, runTransaction, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyASfs5MXS62ehM1kVSj0pudOEUGUh37BYI",
  authDomain: "work-schedule-17c39.firebaseapp.com",
  projectId: "work-schedule-17c39",
  storageBucket: "work-schedule-17c39.firebasestorage.app",
  messagingSenderId: "708640197618",
  appId: "1:708640197618:web:c3731ecf7c7ef80fd3396b"
};
const app = initializeApp(firebaseConfig, 'warehouse');
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(app); }
const CATS = 'wh_cats', ITEMS = 'wh_items', META = 'wh_meta';

const defaults=[
["שתייה",["בקבוק קולה זירו","בקבוק קולה","מים בטעם אפרסק","מים בטעם תפוח","מים בטעם ענבים","פיוז טי","בירה שחורה","פחית קולה","פחית זירו","ספרייט","ספרייט זירו","פאנטה","סודה","מים","פריגת ענבים","פריגת תפוזים","פריגת אשכוליות","פריגת לימונענע"]],
["סכום",["מזלגות","כפות","סכום ארוז","סכינים","צ׳ופסטיקס","מפיות","צלחות","כוסות שתיה קרה"]],
["ציוד נלווה",["קוקוטים + מכסים","חמגשיות קטנות + מכסים","חמגשיות גדולות + מכסים","טופאקו גדול","טופאקו קטן","שקיות אריזה צהוב","שקיות אריזה אדום","שקיות שקופות","שקיות קרטון לבן","קופסא מחולקת + מכסים","מרקיות + מכסים","מכסים של HP","מכסים של קימצ׳י","מכסים 00","מכסים 03","מכסים 07","מכסים 09","מכסים 05","מלח","מגבונים ארוזים","מגבוני ניקיון","גליל נייר","שקיות זבל","קיסמים","ניילון נצמד","קראפט 1100 + מכסים"]],
["ציוד משרדי",["נייר קופה","דפים A4 למדפסת","פלייסמנטים"]],
["רטבים",["סויה","טריאקי","ג׳ינג׳ר","ווסאבי","בוטנים"]]
];

function localToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function qtyLabel(i){return i.qty+' '+(i.unit==='case'?(i.qty==1?'ארגז':'ארגזים'):"יח'")}

// ---- state: personal (this device) + shared (Firestore) ----
const S={mode:'list',date:localToday()};
let rawCats=[],rawItems=[],M=[],loaded={c:false,i:false},err=null,serverCats=false,seeding=false,seedDone=false;
let lastCat=null,prevMode='list',unlocked=false,editing=null,pendingKeep=null;
const cat=id=>M.find(c=>c.id==id);
const item=(cid,iid)=>{const c=cat(cid);return c?c.items.find(i=>i.id==iid):undefined};
const iref=id=>doc(db,ITEMS,id);
const nextOrder=list=>list.reduce((m,x)=>Math.max(m,x.order),-1)+1;

function build(){
  const by={};
  rawItems.forEach(i=>{(by[i.cat]=by[i.cat]||[]).push(i)});
  const sort=(a,b)=>(a.order-b.order)||(a.id<b.id?-1:1);
  M=[...rawCats].sort(sort).map(c=>({...c,items:(by[c.id]||[]).sort(sort)}));
  if(lastCat==null||!M.some(c=>c.id==lastCat))lastCat=M.length?M[0].id:null;
}
function refresh(){build();render()}

onSnapshot(collection(db,CATS),s=>{
  rawCats=s.docs.map(d=>{const x=d.data();return{id:d.id,name:x.name||'',qty:!!x.qty,order:x.order||0}});
  loaded.c=true;serverCats=!s.metadata.fromCache;err=null;refresh();trySeed();
},e=>{err=e;render()});
onSnapshot(collection(db,ITEMS),s=>{
  rawItems=s.docs.map(d=>{const x=d.data();return{id:d.id,t:x.t||'',cat:x.cat,order:x.order||0,need:!!x.need,qty:x.qty||1,unit:x.unit||'bottle',done:!!x.done,nf:!!x.nf}});
  loaded.i=true;err=null;refresh();
},e=>{err=e;render()});

async function trySeed(){
  if(seeding||seedDone||!serverCats||rawCats.length)return;
  seeding=true;
  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,META,'seed');
      const snap=await tx.get(ref);
      if(snap.exists())return;
      tx.set(ref,{done:true,at:Date.now()});
      defaults.forEach(([n,its],ci)=>{
        tx.set(doc(db,CATS,'cat_'+ci),{name:n,qty:n==='שתייה',order:ci});
        its.forEach((t,ii)=>tx.set(doc(db,ITEMS,`item_${ci}_${ii}`),{t,cat:'cat_'+ci,order:ii,need:false,qty:1,unit:'bottle',done:false}));
      });
    });
    seedDone=true;
  }catch(e){console.warn('seed',e)}
  seeding=false;
}

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},3500)}
const fail=e=>{console.error(e);toast(e&&e.code==='permission-denied'?'אין הרשאה – חסרים כללי Firestore':'הפעולה נכשלה, נסה שוב')};
const w=p=>{p.catch(fail)};

function viewList(){
  return M.map(c=>{
    const n=c.items.filter(i=>i.need).length;
    return `<section class="cat"><h2><span>${esc(c.name)}</span><small>סומנו ${n} מתוך ${c.items.length}</small></h2>`+
    (c.items.length?c.items.map(i=>`<div class="item pick${i.need?' need':''}" data-act="need" data-c="${c.id}" data-i="${i.id}">
      <span class="box">${i.need?'✓':''}</span><span class="name">${esc(i.t)}</span>
      ${!i.need?'<span class="qtybar ph" aria-hidden="true"><span class="sq"></span><span class="n">1</span><span class="sq"></span><span class="unit"></span></span>':''}${i.need?`<span class="qtybar">
        <button class="sq" data-act="dec" data-c="${c.id}" data-i="${i.id}">−</button><span class="n">${i.qty}</span><button class="sq" data-act="inc" data-c="${c.id}" data-i="${i.id}">+</button>
        <button class="unit" data-act="unit" data-c="${c.id}" data-i="${i.id}">${i.unit==='case'?'ארגז':"יח'"}</button></span>`:''}
    </div>`).join(''):'<div class="empty">אין מוצרים בקטגוריה</div>')+`</section>`}).join('')+
    `<div class="tools"><button data-act="reset">נקה את כל הבחירות</button></div>`;
}
function viewWh(){
  const cs=M.filter(c=>c.items.some(i=>i.need));
  if(!cs.length)return `<div class="empty">לא נבחרו פריטים.<br>עבור למצב רשימה וסמן מה צריך.</div>`;
  const all=M.flatMap(c=>c.items.filter(i=>i.need)),left=all.filter(i=>!i.done&&!i.nf).length,nfn=all.filter(i=>i.nf).length;
  return `<p class="sum">נשארו ${left} מתוך ${all.length} פריטים${nfn?` · ${nfn} לא נמצאו`:''}</p>`+cs.map(c=>{
    const its=c.items.filter(i=>i.need);
    return `<section class="cat"><h2><span>${esc(c.name)}</span><small>${its.filter(i=>!i.done&&!i.nf).length}/${its.length}</small></h2>`+
    its.map(i=>i.nf?`<div class="item wh nf"><span class="name">${esc(i.t)}</span><span class="qty">${qtyLabel(i)}</span><span class="nftag">לא נמצא</span></div>`:`<div class="item wh${i.done?' done':''}" data-act="done" data-c="${c.id}" data-i="${i.id}"><span class="name">${esc(i.t)}</span><span class="qty">${qtyLabel(i)}</span>${i.done?'':`<button class="nfbtn" data-act="nf" data-c="${c.id}" data-i="${i.id}">לא מצאתי</button>`}</div>`).join('')+`</section>`}).join('')+
    `<div class="tools"><button data-act="reset">נקה את כל הבחירות</button></div>`;
}
function viewMan(){
  const nfs=M.flatMap(c=>c.items.filter(i=>i.need&&i.nf).map(i=>({c,i})));
  const nfHtml=nfs.length?`<section class="cat nfsec"><h2><span>סומנו "לא מצאתי"</span><small>${nfs.length}</small></h2>`+nfs.map(({c,i})=>`<div class="item"><span class="name">${esc(i.t)} <small style="color:#6b7280">${esc(c.name)}</small></span><button class="nfclr" data-act="nfClear" data-c="${c.id}" data-i="${i.id}">בטל</button></div>`).join('')+`</section>`:'';
  return nfHtml+`<div class="form"><h3>הוספת מוצר</h3>
    <label>שם המוצר</label><input type="text" id="pName" placeholder="לדוגמה: קולה לייט">
    <label>קטגוריה</label><select id="pCat">${M.map(c=>`<option value="${c.id}"${c.id==lastCat?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <button class="btn" data-act="addProd">הוסף מוצר</button></div>
  <div class="form"><h3>קטגוריה חדשה</h3>
    <label>שם הקטגוריה</label><input type="text" id="cName" placeholder="לדוגמה: ניקיון">
    <button class="btn blue" data-act="addCat">הוסף קטגוריה</button></div>`+
  M.map((c,ci)=>`<section class="cat"><h2><span>${esc(c.name)} <small>(${c.items.length})</small></span>
    <span class="acts"><button class="mv mini" data-act="catUp" data-c="${c.id}"${ci==0?' disabled':''} aria-label="הזז קטגוריה למעלה">▲</button><button class="mv mini" data-act="catDown" data-c="${c.id}"${ci==M.length-1?' disabled':''} aria-label="הזז קטגוריה למטה">▼</button><button class="edit mini" data-act="editCat" data-c="${c.id}" title="ערוך קטגוריה">✏️</button><button class="del mini" data-act="delCat" data-c="${c.id}" title="מחק קטגוריה">🗑</button></span></h2>`+
    (c.items.length?c.items.map((i,ix)=>`<div class="item"><span class="name">${esc(i.t)}</span><button class="mv" data-act="itemUp" data-c="${c.id}" data-i="${i.id}"${ix==0?' disabled':''} aria-label="הזז למעלה">▲</button><button class="mv" data-act="itemDown" data-c="${c.id}" data-i="${i.id}"${ix==c.items.length-1?' disabled':''} aria-label="הזז למטה">▼</button><button class="edit" data-act="editItem" data-c="${c.id}" data-i="${i.id}" aria-label="ערוך">✏️</button><button class="del" data-act="delItem" data-c="${c.id}" data-i="${i.id}" aria-label="הסר">×</button></div>`).join(''):'<div class="empty">אין מוצרים</div>')+`</section>`).join('');
}

function render(){
  $('bList').classList.toggle('active',S.mode==='list');
  $('bWh').classList.toggle('active',S.mode==='warehouse');
  $('bMan').classList.toggle('active',S.mode==='manage');
  $('date').value=S.date;
  const v=$('view');
  if(err){v.innerHTML=`<div class="empty">${err.code==='permission-denied'?'אין הרשאת גישה לנתונים.<br>יש להוסיף את כללי Firestore של האפליקציה.':'שגיאת חיבור.<br>בדוק אינטרנט ורענן את הדף.'}</div>`;return}
  if(!(loaded.c&&loaded.i)){v.innerHTML='<div class="empty">טוען...</div>';return}
  let saved=null;
  if(S.mode==='manage'&&$('pName')){const f=document.activeElement;saved={pName:$('pName').value,pCat:$('pCat').value,cName:$('cName').value,focus:f&&f.id}}
  v.innerHTML=S.mode==='list'?viewList():S.mode==='warehouse'?viewWh():viewMan();
  if(saved){
    $('pName').value=saved.pName;$('cName').value=saved.cName;
    if([...$('pCat').options].some(o=>o.value==saved.pCat))$('pCat').value=saved.pCat;
    if(saved.focus&&$(saved.focus))$(saved.focus).focus();
  }
  if(pendingKeep){
    const pk=pendingKeep;pendingKeep=null;
    if(Date.now()-pk.t<1500){const nb=document.querySelector(pk.sel);if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-pk.top)}
  }
  checkDone();
}

// ---- סיום מצב מחסן: קונפטי + שאלת ניקוי ----
let whPrev=null;
function whComplete(){
  const all=M.flatMap(c=>c.items.filter(i=>i.need));
  return all.length>0&&all.every(i=>i.done||i.nf);
}
function checkDone(){
  if(S.mode!=='warehouse'){whPrev=null;return}
  const now=whComplete();
  if(now&&whPrev===false)celebrate();
  whPrev=now;
}
function celebrate(){
  confetti();
  setTimeout(()=>{if(S.mode==='warehouse'&&whComplete())$('cl').hidden=false},3000);
}
function confetti(){
  const W=innerWidth,H=innerHeight,dpr=window.devicePixelRatio||1;
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40';
  cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#ef4444','#f59e0b','#22c55e','#2563eb','#a855f7','#ec4899'];
  const ps=Array.from({length:260},(_,k)=>k%3===0?({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:8+Math.random()*8,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}):({x:k%2?-10:W+10,y:H*.55,vx:(k%2?1:-1)*(4+Math.random()*9),vy:-(6+Math.random()*12),s:7+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(t-t0<3000)requestAnimationFrame(f);else cv.remove();
  })(t0);
}
function clearAll(){
  const b=writeBatch(db);let n=0;
  M.forEach(x=>x.items.forEach(z=>{if(z.need||z.done||z.nf){b.update(iref(z.id),z.nf?{need:false,done:false,qty:1,unit:'bottle',nf:false}:{need:false,done:false,qty:1,unit:'bottle'});n++}}));
  if(n)w(b.commit());
}

// ---- מניעת כפל מוצר ----
const norm=s=>String(s).trim().replace(/\s+/g,' ').toLowerCase();
const dupIn=(cc,name,exceptId)=>!!cc&&cc.items.some(z=>z.id!==exceptId&&norm(z.t)===norm(name));

function addProd(){
  const t=$('pName').value.trim();if(!t){$('pName').focus();return}
  const cid=$('pCat').value,cc=cat(cid);if(!cc)return;
  if(dupIn(cc,t)){toast(`"${t}" כבר קיים בקטגוריה ${cc.name}`);$('pName').focus();return}
  lastCat=cid;
  w(setDoc(doc(collection(db,ITEMS)),{t,cat:cid,order:nextOrder(cc.items),need:false,qty:1,unit:'bottle',done:false}));
  $('pName').value='';$('pName').focus();
}
function addCat(){
  const n=$('cName').value.trim();if(!n){$('cName').focus();return}
  const ref=doc(collection(db,CATS));lastCat=ref.id;
  w(setDoc(ref,{name:n,qty:true,order:nextOrder(M)}));
  $('cName').value='';
}
function reorder(list,coll,x,y){
  const arr=[...list];[arr[x],arr[y]]=[arr[y],arr[x]];
  const b=writeBatch(db);arr.forEach((d,k)=>b.update(doc(db,coll,d.id),{order:k}));
  w(b.commit());
}
function keep(el,sel){pendingKeep={sel,top:el.getBoundingClientRect().top,t:Date.now()}}

const needsItem=['nf','nfClear','need','inc','dec','unit','done','delItem','editItem','itemUp','itemDown'];
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,c=el.dataset.c,i=el.dataset.i;
  const it=(c&&i)?item(c,i):null,cc=c?cat(c):null;
  if(needsItem.includes(a)&&!it)return;
  if(['catUp','catDown','delCat','editCat'].includes(a)&&!cc)return;
  switch(a){
    case 'need':w(updateDoc(iref(i),it.need?(it.nf?{need:false,done:false,qty:1,unit:'bottle',nf:false}:{need:false,done:false,qty:1,unit:'bottle'}):{need:true}));break;
    case 'inc':w(updateDoc(iref(i),{qty:increment(1)}));break;
    case 'dec':if(it.qty>1)w(updateDoc(iref(i),{qty:increment(-1)}));break;
    case 'unit':w(updateDoc(iref(i),{unit:it.unit==='case'?'bottle':'case'}));break;
    case 'done':w(updateDoc(iref(i),{done:!it.done}));break;
    case 'reset':{
      if(!confirm('לנקות את כל הבחירות?'))return;
      clearAll();
      break}
    case 'nf':w(updateDoc(iref(i),{nf:true,done:false}));break;
    case 'nfClear':if(S.mode!=='manage')return;w(updateDoc(iref(i),{nf:false}));break;
    case 'addProd':addProd();break;
    case 'addCat':addCat();break;
    case 'delItem':if(confirm(`להסיר את "${it.t}" מהרשימה?`))w(deleteDoc(iref(i)));break;
    case 'delCat':{
      if(!confirm(`למחוק את הקטגוריה "${cc.name}" עם כל ${cc.items.length} המוצרים?`))return;
      const b=writeBatch(db);cc.items.forEach(z=>b.delete(iref(z.id)));b.delete(doc(db,CATS,cc.id));w(b.commit());
      break}
    case 'itemUp':case 'itemDown':{
      const arr=cc.items,x=arr.findIndex(z=>z.id==i),y=a==='itemUp'?x-1:x+1;
      if(x<0||y<0||y>=arr.length)return;
      keep(el,`[data-act="${a}"][data-i="${i}"]`);reorder(arr,ITEMS,x,y);break}
    case 'catUp':case 'catDown':{
      const x=M.findIndex(z=>z.id==c),y=a==='catUp'?x-1:x+1;
      if(x<0||y<0||y>=M.length)return;
      keep(el,`[data-act="${a}"][data-c="${c}"]`);reorder(M,CATS,x,y);break}
    case 'editItem':openEdit('item',c,i);break;
    case 'editCat':openEdit('cat',c);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='pName')addProd();
  if(e.target.id==='cName')addCat();
});

$('bList').onclick=()=>{S.mode='list';render()};
$('bWh').onclick=()=>{S.mode='warehouse';render()};
$('date').onchange=e=>{S.date=e.target.value};

function openManage(){prevMode=S.mode;S.mode='manage';render()}
function showPw(){$('pwIn').value='';$('pwErr').textContent='';$('pw').hidden=false;setTimeout(()=>$('pwIn').focus(),50)}
function hidePw(){$('pw').hidden=true}
function checkPw(){
  if($('pwIn').value==='2525'){unlocked=true;hidePw();openManage()}
  else{$('pwErr').textContent='סיסמה שגויה';$('pwIn').value='';$('pwIn').focus()}
}
$('bMan').onclick=()=>{
  if(S.mode==='manage'){S.mode=prevMode;render()}
  else if(unlocked)openManage();
  else showPw();
};
$('pwOk').onclick=checkPw;
$('pwCancel').onclick=hidePw;
$('pw').addEventListener('click',e=>{if(e.target.id==='pw')hidePw()});
$('pwIn').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();if(e.key==='Escape')hidePw()});

function openEdit(type,c,i){
  const it=type==='item'?item(c,i):null;
  if(type==='item'&&!it)return;
  editing={type,c,i};$('edErr').textContent='';
  if(type==='item'){
    $('edTitle').textContent='עריכת מוצר';$('edName').value=it.t;
    $('edCat').innerHTML=M.map(x=>`<option value="${x.id}"${x.id==c?' selected':''}>${esc(x.name)}</option>`).join('');
    $('edCatWrap').hidden=false;
  }else{
    $('edTitle').textContent='עריכת קטגוריה';$('edName').value=cat(c).name;$('edCatWrap').hidden=true;
  }
  $('ed').hidden=false;setTimeout(()=>{$('edName').focus();$('edName').select()},50);
}
function hideEdit(){$('ed').hidden=true;editing=null}
function saveEdit(){
  if(!editing)return;
  const n=$('edName').value.trim();
  if(!n){$('edErr').textContent='יש להזין שם';$('edName').focus();return}
  const {type,c,i}=editing;
  if(type==='item'){
    const it=item(c,i),to=cat($('edCat').value);
    if(it){
      if(dupIn(to||cat(c),n,it.id)){$('edErr').textContent=`"${n}" כבר קיים בקטגוריה ${(to||cat(c)).name}`;$('edName').focus();return}
      const patch={t:n};
      if(to&&to.id!=it.cat){patch.cat=to.id;patch.order=nextOrder(to.items);lastCat=to.id}
      w(updateDoc(iref(i),patch));
    }
  }else if(cat(c)){w(updateDoc(doc(db,CATS,c),{name:n}))}
  hideEdit();
}
// ---- ריענון אוטומטי כשיוצאת גרסה חדשה ----
let verBase=null,verBusy=false;
async function verFetch(){
  const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;
  const t=await r.text();let h=t.length;
  for(let i=0;i<t.length;i+=7)h=(h*31+t.charCodeAt(i))|0;
  return h;
}
async function verCheck(){
  if(verBusy||!navigator.onLine)return;
  verBusy=true;
  try{
    const h=await verFetch();
    if(verBase===null)verBase=h;
    else if(h!==verBase){
      const busy=[...document.querySelectorAll('.ov')].some(o=>!o.hidden)||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
      if(!busy)location.reload();
    }
  }catch(e){}
  verBusy=false;
}
verCheck();
setInterval(verCheck,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)verCheck()});
// ---- חלון יציאה (כפתור חזרה) ----
history.replaceState({base:1},'');history.pushState({guard:1},'');
let exiting=false;
addEventListener('popstate',()=>{
  if(exiting)return;
  history.pushState({guard:1},'');
  const open=[...document.querySelectorAll('.ov')].find(o=>!o.hidden&&o.id!=='ex');
  if(open){open.hidden=true;return}
  $('ex').hidden=!$('ex').hidden;
});
$('exNo').onclick=()=>{$('ex').hidden=true};
$('ex').addEventListener('click',e=>{if(e.target.id==='ex')$('ex').hidden=true});
$('exYes').onclick=()=>{exiting=true;$('ex').hidden=true;history.go(-2);setTimeout(()=>{try{window.close()}catch(e){}},300)};
$('clYes').onclick=()=>{$('cl').hidden=true;clearAll()};
$('clNo').onclick=()=>{$('cl').hidden=true};
$('edOk').onclick=saveEdit;
$('edCancel').onclick=hideEdit;
$('ed').addEventListener('click',e=>{if(e.target.id==='ed')hideEdit()});
$('edName').addEventListener('keydown',e=>{if(e.key==='Enter')saveEdit();if(e.key==='Escape')hideEdit()});

function updateNet(){$('net').hidden=navigator.onLine}
window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);
updateNet();
render();
</script>
